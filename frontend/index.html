<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>LiveBox AI v0.4</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="top">LIVEBOX AI — Telecom Customer Operations MVP v0.4</div>
  <div class="wrap">
    <div class="card">
      <b>Test Customers</b>
      <div id="users"></div>
      <div id="consent-control"></div>
      <p style="font-size:12px;color:#667">Mock data only. No MTN system is connected.</p>
    </div>
    <div class="card chat">
      <div class="head">
        <b id="name">Aisha Bello</b> · <span id="phone">08030000001</span>
        <span id="lang-badge" class="lang-badge">en</span>
        <span id="voice-indicator" class="voice-indicator off">VOICE OFF</span>
        <span id="audio-status" class="audio-status">Audio ready</span>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="bar">
        <input id="q" placeholder="Type a customer request..." onkeydown="if(event.key==='Enter')send()">
        <button onclick="send()">Send</button>
        <button id="voice-btn" onclick="toggleVoice()">🎤 Voice</button>
        <button id="speak-btn" class="voice-control" onclick="startBrowserSpeechInput()" disabled>Speak</button>
        <button id="barge-btn" class="voice-control" onclick="simulateBargeIn()" disabled>Interrupt</button>
        <button id="silence-btn" class="voice-control" onclick="simulateSilence()" disabled>No response</button>
      </div>
    </div>
    <div class="card history" id="history-panel" style="display:none;">
      <div class="head"><b>Conversation History</b></div>
      <div id="history-msgs"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
